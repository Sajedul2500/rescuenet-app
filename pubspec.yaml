name: RescueNetBD
description: The emergency response app for Bangladesh.

publish_to: "none" # Remove this if you plan to publish your package

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  geolocator: ^11.0.0
  permission_handler: ^11.2.0
  http: ^1.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  carousel_slider: ^5.0.0
  video_player: ^2.9.2
  share_plus: ^10.1.3
  connectivity_plus: ^6.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/logo.png"
  remove_alpha_ios: true
